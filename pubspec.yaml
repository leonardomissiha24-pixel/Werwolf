name: werwolf
description: "Werwolf: Blutmond – das Gesellschaftsspiel mit Live-Video."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  flutter_webrtc: ^1.6.3
  material_ui: ^1.1.0
  mqtt_client: ^10.14.0
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Regular.ttf
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cinzel-Black.ttf
          weight: 900
    - family: Cormorant
      fonts:
        - asset: assets/fonts/Cormorant-Regular.ttf
        - asset: assets/fonts/Cormorant-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cormorant-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cormorant-Italic.ttf
          style: italic
        - asset: assets/fonts/Cormorant-SemiBoldItalic.ttf
          weight: 600
          style: italic
